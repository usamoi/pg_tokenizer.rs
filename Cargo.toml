[package]
name = "pg_tokenizer"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "pg_tokenizer"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_pg_tokenizer"
path = "./src/bin/pgrx_embed.rs"

[features]
pg14 = ["pgrx/pg14"]
pg15 = ["pgrx/pg15"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]
lindera-ipadic = ["lindera/ipadic"]
lindera-ipadic-neologd = ["lindera/ipadic-neologd"]
lindera-unidic = ["lindera/unidic"]
lindera-ko-dic = ["lindera/ko-dic"]
lindera-cc-cedict = ["lindera/cc-cedict"]

[dependencies]
anyhow = "1.0.102"
dashmap = "6.1.0"
jieba-rs = "0.8.1"
lindera = "=0.42.4"
pgrx = "=0.17.0"
regex = "1.12.3"
rust-stemmers = { git = "https://github.com/tensorchord/rust-stemmers.git", rev = "51696378e352688b7ffd4fface615370ff5e8768" }
serde.workspace = true
serde_json = "1.0.149"
tocken = "0.1.0"
tokenizers = "0.22.2"
toml = "1.0.3"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.12.0"
validator = { version = "0.20.0", features = ["derive"] }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }

[workspace.lints]
# complexity
clippy.too_many_arguments = "allow"
# unsafe
rust.unsafe_code = "deny"
rust.unsafe_op_in_unsafe_fn = "deny"
# unused
rust.unused_extern_crates = "warn"
rust.unused_import_braces = "warn"
rust.unused_lifetimes = "warn"
rust.unused_macro_rules = "warn"
rust.unused_qualifications = "warn"

[profile.dev]
codegen-units = 256
lto = "off"
opt-level = 1
debug = "full"
strip = "none"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
debug = "none"
strip = "symbols"

[profile.prof]
inherits = "release"
debug = "full"
strip = "none"
