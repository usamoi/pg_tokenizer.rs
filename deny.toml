[graph]
all-features = true

[advisories]
ignore = [
    "RUSTSEC-2021-0127", # serde_cbor is unmaintained
    "RUSTSEC-2024-0436", # paste - no longer maintained
    "RUSTSEC-2025-0141", # bincode - no longer maintained
    "RUSTSEC-2021-0153", # encoding - no longer maintained
    "RUSTSEC-2024-0370", # proc-macro-error - no longer maintained
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    # "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
exceptions = [
    { allow = [
        "Zlib",
    ], crate = "adler32" },
    { allow = [
        "Zlib",
    ], crate = "foldhash" },
]
private = { ignore = true }
